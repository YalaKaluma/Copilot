name: Frontend CI/CD

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      sha:
        required: true
        type: string
      is_destroy:
        required: false
        type: boolean
        default: false
      backend_url:
        required: false
        type: string
        description: "Backend URL from backend deployment"
      image_url:
        required: false
        type: string
        description: "Pre-built image URL (skips build if provided)"
    outputs:
      frontend_url:
        description: "The deployed frontend service URL"
        value: ${{ jobs.deploy.outputs.frontend_url }}

jobs:
  build:
    name: Build Frontend Image
    if: ${{ !inputs.is_destroy && !inputs.image_url }}
    runs-on: ubuntu-latest
    outputs:
      image_url: ${{ steps.build.outputs.image_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.REGION || 'asia-southeast1' }}-docker.pkg.dev --quiet

      - name: Determine Backend URL
        id: backend
        run: |
          REGION="${{ vars.REGION || 'asia-southeast1' }}"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          APP_NAME="${{ vars.APP_NAME || 'app' }}"
          ENVIRONMENT="${{ inputs.branch_name == 'main' && 'prod' || inputs.branch_name }}"
          BACKEND_SERVICE=$(echo "${APP_NAME}-backend-${ENVIRONMENT}" | tr '[:upper:]' '[:lower:]' | tr '_' '-')

          # Priority: 1) Input from workflow, 2) Environment variable, 3) Discover from Cloud Run
          if [ -n "${{ inputs.backend_url }}" ]; then
            echo "backend_url=${{ inputs.backend_url }}" >> $GITHUB_OUTPUT
            echo "Using backend URL from workflow input"
          elif [ -n "${{ vars.VITE_BACKEND_URL }}" ]; then
            echo "backend_url=${{ vars.VITE_BACKEND_URL }}" >> $GITHUB_OUTPUT
            echo "Using backend URL from environment variable"
          else
            # Try to discover from Cloud Run
            BACKEND_URL=$(gcloud run services describe ${BACKEND_SERVICE} \
              --region=${REGION} \
              --project=${PROJECT_ID} \
              --format='value(status.url)' 2>/dev/null || echo "")

            if [ -n "$BACKEND_URL" ]; then
              echo "backend_url=${BACKEND_URL}" >> $GITHUB_OUTPUT
              echo "Auto-discovered backend URL: ${BACKEND_URL}"
            else
              echo "backend_url=" >> $GITHUB_OUTPUT
              echo "⚠️ No backend URL found - frontend will use relative /api path"
            fi
          fi

      - name: Build and Push Docker Image
        id: build
        run: |
          set -e  # Exit on error

          REGION="${{ vars.REGION || 'asia-southeast1' }}"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          APP_NAME="${{ vars.APP_NAME || 'app' }}"
          ENVIRONMENT="${{ inputs.branch_name == 'main' && 'prod' || inputs.branch_name }}"

          # Sanitize service name
          SERVICE_NAME=$(echo "${APP_NAME}-frontend-${ENVIRONMENT}" | tr '[:upper:]' '[:lower:]' | tr '_' '-')

          # Ensure Artifact Registry repository exists
          if ! gcloud artifacts repositories describe ${SERVICE_NAME} --location=${REGION} --project=${PROJECT_ID} &>/dev/null; then
            echo "Creating Artifact Registry repository: ${SERVICE_NAME}"
            gcloud artifacts repositories create ${SERVICE_NAME} \
              --repository-format=docker \
              --location=${REGION} \
              --project=${PROJECT_ID} \
              --description="Docker repository for ${SERVICE_NAME}"
          fi

          IMAGE_URL="${REGION}-docker.pkg.dev/${PROJECT_ID}/${SERVICE_NAME}/${SERVICE_NAME}:${{ inputs.sha }}"

          echo "📦 Image URL: ${IMAGE_URL}"

          echo "🔨 Building image..."
          docker build \
            --build-arg NODE_ENV="${{ vars.NODE_ENV || 'production' }}" \
            --build-arg ENVIRONMENT="${ENVIRONMENT}" \
            --build-arg VITE_BACKEND_URL="${{ steps.backend.outputs.backend_url }}" \
            --build-arg VITE_PUBLIC_URL="${{ vars.VITE_PUBLIC_URL || '' }}" \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY="${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" \
            -t "${IMAGE_URL}" \
            -f services/frontend/Dockerfile \
            .

          echo "📤 Pushing image..."
          docker push "${IMAGE_URL}"

          echo "✅ Image pushed successfully"

          # Save to file for artifact upload
          echo "${IMAGE_URL}" > image_url.txt

      - name: Upload image URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-url
          path: image_url.txt
          retention-days: 1

  deploy:
    name: Deploy Frontend - ${{ inputs.branch_name }}
    needs: [build]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped' || inputs.is_destroy) }}
    runs-on: ubuntu-latest

    outputs:
      frontend_url: ${{ steps.output.outputs.frontend_url }}

    environment:
      name: ${{ inputs.branch_name == 'main' && 'prod' || inputs.branch_name }}
      url: ${{ steps.output.outputs.frontend_url }}

    env:
      GOOGLE_APPLICATION_CREDENTIALS: gcp.json

      # Terraform variables
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_environment: ${{ inputs.branch_name == 'main' && 'prod' || inputs.branch_name }}
      TF_VAR_app_name: ${{ vars.APP_NAME || 'app' }}
      TF_VAR_region: ${{ vars.REGION || 'asia-southeast1' }}
      # TF_VAR_image_url is set from artifact in "Set image URL from artifact" step

      # Application configuration
      TF_VAR_node_env: ${{ vars.NODE_ENV || 'production' }}

      # Infrastructure
      TF_VAR_cpu_limit: ${{ vars.FRONTEND_CPU || '1' }}
      TF_VAR_memory_limit: ${{ vars.FRONTEND_MEMORY || '512Mi' }}
      TF_VAR_min_instances: ${{ vars.FRONTEND_MIN_INSTANCES || '0' }}
      TF_VAR_max_instances: ${{ vars.FRONTEND_MAX_INSTANCES || '10' }}
      TF_VAR_container_concurrency: ${{ vars.FRONTEND_CONCURRENCY || '1000' }}
      TF_VAR_timeout_seconds: ${{ vars.FRONTEND_TIMEOUT || '60' }}

    defaults:
      run:
        shell: bash
        working-directory: ./terraform/services/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image URL artifact
        if: ${{ !inputs.is_destroy && !inputs.image_url }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-image-url
          path: /tmp

      - name: Set image URL
        if: ${{ !inputs.is_destroy }}
        run: |
          if [ -n "${{ inputs.image_url }}" ]; then
            echo "TF_VAR_image_url=${{ inputs.image_url }}" >> $GITHUB_ENV
            echo "✅ Image URL from input: ${{ inputs.image_url }}"
          else
            IMAGE_URL=$(cat /tmp/image_url.txt)
            echo "TF_VAR_image_url=${IMAGE_URL}" >> $GITHUB_ENV
            echo "✅ Image URL from artifact: ${IMAGE_URL}"
          fi
        working-directory: .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Export GCP credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > gcp.json

      - name: Terraform Init
        run: |
          terraform init -upgrade \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -backend-config="prefix=${{ github.event.repository.name }}/services/frontend"

      - name: Terraform Workspace
        run: |
          WORKSPACE="${{ inputs.branch_name == 'main' && 'prod' || inputs.branch_name }}"
          terraform workspace select "$WORKSPACE" || terraform workspace new "$WORKSPACE"

      - name: Validate Image URL
        if: ${{ !inputs.is_destroy }}
        run: |
          if [ -z "$TF_VAR_image_url" ]; then
            echo "❌ Error: TF_VAR_image_url is empty."
            echo "The artifact download may have failed."
            exit 1
          fi
          echo "✅ Image URL: $TF_VAR_image_url"

      - name: Terraform Plan
        if: ${{ !inputs.is_destroy }}
        run: terraform plan -input=false

      - name: Terraform Apply
        if: ${{ !inputs.is_destroy }}
        run: terraform apply -auto-approve -input=false

      - name: Set output URL
        if: ${{ !inputs.is_destroy }}
        id: output
        run: |
          FRONTEND_URL=$(terraform output -raw frontend_url)
          echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "✅ Frontend deployed at: $FRONTEND_URL"

      - name: Terraform Destroy
        if: ${{ inputs.is_destroy }}
        run: terraform destroy -auto-approve

      - name: Cleanup
        if: always()
        run: rm -f gcp.json
