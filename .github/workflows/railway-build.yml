name: Railway Server Build

on:
  push:
    branches: [main, staging]
    paths:
      - "services/backend/**"
      - "services/frontend/**"
      - "packages/**"
      - ".github/workflows/railway-build.yml"
  pull_request:
    paths:
      - "services/backend/**"
      - "services/frontend/**"
      - "packages/**"
      - ".github/workflows/railway-build.yml"
  workflow_dispatch:

concurrency:
  group: railway-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-image:
    name: Build Railway backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend/Dockerfile
          push: false
          cache-from: type=gha,scope=railway-backend
          cache-to: type=gha,mode=max,scope=railway-backend

  frontend-image:
    name: Build Railway frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/frontend/Dockerfile
          push: false
          build-args: |
            NODE_ENV=production
            ENVIRONMENT=prod
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }}
            VITE_PUBLIC_URL=${{ vars.VITE_PUBLIC_URL }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=railway-frontend
          cache-to: type=gha,mode=max,scope=railway-frontend

  ready:
    name: Railway build gate
    runs-on: ubuntu-latest
    needs: [backend-image, frontend-image]
    steps:
      - name: Summarize
        run: |
          echo "## Railway build passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Both production Docker images were built on GitHub-hosted runners." >> "$GITHUB_STEP_SUMMARY"
          echo "No local npm, pnpm, Node.js, Python, or Docker build is required." >> "$GITHUB_STEP_SUMMARY"
