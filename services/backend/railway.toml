[build]
builder = "DOCKERFILE"
dockerfilePath = "services/backend/Dockerfile"
watchPatterns = [
  "services/backend/**",
  "packages/**",
  "services/backend/railway.toml",
]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
