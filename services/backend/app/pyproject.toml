[project]
name = "backend"
version = "0.1.0"
description = "FastAPI Backend Service"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Core FastAPI
    "fastapi[standard]>=0.115.11",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "boto3>=1.34.0",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.10",
    # Authentication
    "clerk-backend-api>=3.0.3",
    "pyjwt[crypto]>=2.10.1",
    # Utilities
    "pyhumps>=3.8.0", # camelCase <-> snake_case conversion
    "pyyaml>=6.0.2",
    # Redis
    "redis>=7.1.0",
    # LLM Providers
    "openai>=2.14.0",
    "anthropic>=0.75.0",
    "google-genai>=1.56.0",
    # LLM Observability (optional)
    "langfuse>=3.0.0",
    "google-cloud-storage>=3.3.0",
    "openai-agents[sqlalchemy]>=0.4.2",
    "debugpy>=1.8.20",
    "pydantic-yaml>=1.6.0",
    "datamodel-code-generator[http]>=0.54.0",
    "async-lru>=2.2.0",
    "pandas>=3.0.1",
    "tabulate>=0.10.0",
    "openpyxl>=3.1.5",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.28.1", # For async test client
    "aiosqlite>=0.20.0", # For SQLite async testing
    "ruff>=0.9.10",
    "black>=24.12.1",
    "mypy>=1.14.1",
    "types-PyYAML>=6.0.12",  # Type stubs for PyYAML
    "types-requests>=2.31.0",  # Type stubs for requests
    "ipython>=8.31.0",
    "testcontainers>=4.12.0",
    "pytest-mock>=3.14.1",
    # "eralchemy2>=1.4.1",  # For generating ERD diagrams - disabled, requires pygraphviz which needs C++ build tools on Windows
    "pre-commit>=4.5.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = false
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
disable_error_code = ["method-assign", "attr-defined", "import-untyped", "annotation-unchecked"]

# Skip type checking for generated API models (datamodel-code-generator output)
[[tool.mypy.overrides]]
module = "models.skai_api.autogen"
ignore_errors = true

[[tool.mypy.overrides]]
module = "models.skai_api_v2.generated"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.datamodel-codegen]
url = "https://analytics.gw.skaix-stg.engine.simon-kucher.com/openapi.json"
output = "models/skai_api/autogen.py"
output-model-type = "pydantic_v2.BaseModel"
base-class = "schemas.base.CamelCaseModel"
enum-field-as-literal = "one"
use-annotated = true
set-default-enum-member = true
use-tuple-for-fixed-items = false
strict-nullable = true
use-field-description-example = true

[tool.datamodel-codegen.profiles.skai_api_v2]
url = "https://backend.skaig-stg.engine.simon-kucher.com/analytics/openapi.json"
output = "models/skai_api_v2/generated.py"
output-model-type = "pydantic_v2.BaseModel"
base-class = "schemas.base.CamelCaseModel"
enum-field-as-literal = "one"
use-annotated = true
set-default-enum-member = true
use-tuple-for-fixed-items = false
strict-nullable = true
use-field-description-example = true
disable-timestamp = true
use-operation-id-as-name = true
openapi-include-paths = [
    "/api/v1/filter-values",
    "/api/v1/filter-values/related",
    "/api/v1/promo/heatmap",
]
openapi-scopes = ["schemas", "paths", "requestbodies", "parameters"]
